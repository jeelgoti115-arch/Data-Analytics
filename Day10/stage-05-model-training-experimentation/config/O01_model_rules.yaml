# =====================================================================
# CONFIGURATION: Stage 5 Model Training, Tuning & Validation Rules
# FILE: config/O01_model_rules.yaml
# =====================================================================

global:
  random_state: 42
  test_size: 0.2
  target_column: "churn_status"

cross_validation:
  strategy: "stratified_kfold"
  n_splits: 5
  shuffle: true

imbalance_handling:
  strategy: "class_weight"  # Options: 'none', 'class_weight', 'smote'
  smote_sampling_strategy: 0.5

baseline_models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
  decision_tree:
    max_depth: 5
    min_samples_split: 20

advanced_ensembles:
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
  catboost:
    iterations: 200
    learning_rate: 0.05
    depth: 6
    verbose: 0

optimization:
  n_trials: 50
  metric: "roc_auc"
  timeout_seconds: 600